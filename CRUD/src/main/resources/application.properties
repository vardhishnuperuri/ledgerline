spring.application.name=ledgerline

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_db
spring.datasource.username=postgres
spring.datasource.password=Bunny@2005
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:ledgerline-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=86400000

# Server
server.port=8080

# Admin bootstrap (first-run only — change these before first start)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@LedgerLine1}
app.admin.email=${ADMIN_EMAIL:admin@ledgerline.com}

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=false
