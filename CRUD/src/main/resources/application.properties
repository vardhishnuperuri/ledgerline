spring.application.name=ledgerline

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:ledgerline-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=86400000

# Server
server.port=8080

# Admin bootstrap (first-run only — change these before first start)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@LedgerLine1}
app.admin.email=${ADMIN_EMAIL:admin@ledgerline.com}

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Connection pool — keeps connections warm to avoid cold-start latency
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.max-active=8
